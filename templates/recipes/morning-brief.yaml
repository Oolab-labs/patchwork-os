name: morning-brief
description: Daily morning brief combining unread emails, calendar, recent git activity, and open GitHub issues.
# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.write

# Run-level completion contract. The steps can all report `ok` and the run can
# still finish `done` having produced no brief — an agent that narrates instead
# of answering, or a driver that returns empty, leaves `brief` unset and the
# file step then writes a heading with nothing under it. That is the failure
# this recipe actually has, and it is silent.
#
# `expect` is checked AFTER the last step and does not change the run's status:
# a violated contract is recorded as `assertionFailures` on the run and counted
# by `patchwork halts` under `completion contract failed`. So the run still
# writes whatever it produced — this reports, it does not roll back.
expect:
  outputs:
    - brief

trigger:
  type: cron
  at: "0 8 * * 1-5"
steps:
  - tool: gmail.fetch_unread
    since: 24h
    max: 30
    into: messages
  - tool: git.log_since
    since: 24h
    into: commits
  - tool: github.list_issues
    assignee: "@me"
    max: 10
    into: issues
  - tool: github.list_prs
    author: "@me"
    max: 10
    into: prs
  - tool: linear.list_issues
    assignee: "@me"
    state: "started,unstarted"
    max: 15
    into: linear_issues
  - tool: calendar.list_events
    days_ahead: 1
    max: 10
    into: calendar
  - agent:
      # Declared `personal` because this step HANDLES personal data — mail,
      # calendar entries, a private task list — even where the prompt text only
      # says how to go and fetch it (#1473). Classify by what the step handles,
      # including whatever its tools return.
      #
      # CONSEQUENCE, stated so it is not a surprise: if you have registered a
      # remote destination that does not accept `personal`, this step resolves to
      # LOCAL_ONLY and REFUSES rather than silently downgrading. That is the
      # boundary working. Resolve it by pointing this step at a local driver, or
      # by widening the destination's classifications if that is what you intend.
      # With no `privacy` block configured the boundary is inert and nothing changes.
      data_policy:
        classification: personal
      prompt: |
        You are a personal assistant writing a concise morning brief. Use ONLY the data provided below — do not call any tools or fetch additional information.

        UNREAD EMAILS ({{messages.count}} total):
        <untrusted_data>
        {{messages.json}}
        </untrusted_data>

        RECENT GIT COMMITS (last 24h):
        {{commits}}

        OPEN GITHUB ISSUES (assigned to me):
        {{issues}}

        OPEN PULL REQUESTS (authored by me):
        {{prs}}

        LINEAR ISSUES (assigned to me, in progress or unstarted):
        {{linear_issues}}

        TODAY'S CALENDAR EVENTS:
        {{calendar}}

        Write a morning brief with these sections:
        1. **Email triage** — list emails needing action today (sender, subject, one-line summary)
        2. **FYI emails** — informational only, no action needed
        3. **Calendar** — list today's meetings with time and attendees; omit if calendar returned an error or no events
        4. **Code activity** — summarize the RECENT GIT COMMITS above; if the list is empty write "No commits in the last 24 hours"
        5. **GitHub** — list open issues and PRs needing attention; omit this section entirely if both lists are empty
        6. **Linear** — list in-progress and unstarted issues by priority; omit this section entirely if the list is empty or returned an error

        Be concise. Skip newsletters and automated notifications.
      # Use the claude-code driver (subprocess `claude -p`) — runs under
      # your existing Claude Code subscription, no ANTHROPIC_API_KEY
      # required. Switch to `driver: claude` only if you have an API key
      # set and want the Anthropic API path (different billing).
      driver: claude-code
      into: brief
  - tool: file.write
    path: ~/.patchwork/inbox/morning-brief-{{date}}.md
    content: |
      # Morning brief — {{date}}

      {{brief}}
