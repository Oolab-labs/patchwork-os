# yaml-language-server: $schema=https://patchwork.dev/schemas/recipe.v1.json
# Body for the Release Worker (templates/workers/release-notes.worker.yaml).
# Self-waking on every commit (git_hook → onGitCommit, wired in #1016/#1018).
apiVersion: patchwork.sh/v1
name: release-notes
description: After a commit lands, draft a changelog entry from the new commits into the inbox.
allowWrites:
  - file.write
# Run-level completion contract. Every step can report ok and the run can still
# finish `done` having produced no `notes` — an agent that narrates instead of
# answering, or a driver that returns empty, leaves the key unset and the step
# after it writes a heading with nothing under it. That is this recipe's real
# failure mode and it is silent.
#
# Checked AFTER the last step; it does NOT change the run's status. A violation
# is recorded as `assertionFailures` on the run and counted by `patchwork halts`
# under `completion contract failed`. So the run still writes whatever it
# produced — this reports, it does not roll back.
#
# Asserts only the release notes it drafts: the upstream fetch steps are
# allowed to come back empty (no commits today, an empty calendar), and turning
# a quiet day into a halt would be a contract that cries wolf.
expect:
  outputs:
    - notes

trigger:
  type: git_hook
  event: post-commit
steps:
  - id: get_commits
    tool: git.log_since
    since: 24h
    into: commits
  - id: draft_notes
    agent:
      # Declared `internal` — source, diagnostics, git history, test output, issue
      # text. Declared EXPLICITLY rather than left to the default, which is also
      # `internal`: an absent policy means nobody decided, and a reference template
      # should model the deciding (#1473).
      data_policy:
        classification: internal
      prompt: |
        New commits landed in the last 24h:
        {{commits}}

        Write a concise changelog entry as a markdown bullet list — one line per
        user-facing change, grouped under feat / fix / chore. Omit pure noise
        (merge commits, formatting-only). If nothing is user-facing, say so.
      # subprocess `claude -p` under your existing subscription (no API key)
      driver: claude-code
      into: notes
  - id: write_note
    tool: file.write
    path: ~/.patchwork/inbox/release-notes-{{date}}.md
    content: |
      # Release notes draft — {{date}}

      {{notes}}
