name: daily-status
description: Every morning at 08:00, summarize yesterday's commits + today's calendar hints from local files.
# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.write

trigger:
  type: cron
  at: "0 8 * * *"
steps:
  - tool: git.log_since
    since: "24h"
    into: commits
  - tool: file.read
    path: ~/.patchwork/planned.md
    into: plan
    optional: true
  - agent:
      # Declared `internal` — source, diagnostics, git history, test output, issue
      # text. Declared EXPLICITLY rather than left to the default, which is also
      # `internal`: an absent policy means nobody decided, and a reference template
      # should model the deciding (#1473).
      data_policy:
        classification: internal
      prompt: |
        Write a 5-line morning brief. Yesterday's commits: {{commits}}.
        Today's plan: {{plan}}.
      into: brief
  - tool: file.write
    path: ~/.patchwork/inbox/daily-status-{{date}}.md
    content: "{{brief}}\n"
