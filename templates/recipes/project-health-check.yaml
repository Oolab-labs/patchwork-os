# yaml-language-server: $schema=https://raw.githubusercontent.com/patchworkos/recipes/main/schema/recipe.v1.json
apiVersion: patchwork.sh/v1
name: project-health-check
description: Fetch git activity, open issues, and diagnostics in parallel, then write a health summary.
# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.write

trigger:
  type: manual
maxConcurrency: 4
steps:
  - id: gather
    parallel:
      - id: commits
        tool: git.log_since
        since: 24h
      - id: issues
        tool: github.list_issues
        assignee: "@me"
        max: 20
      - id: prs
        tool: github.list_prs
        author: "@me"
        max: 10
  - id: summarize
    agent:
      # Declared `internal` — source, diagnostics, git history, test output, issue
      # text. Declared EXPLICITLY rather than left to the default, which is also
      # `internal`: an absent policy means nobody decided, and a reference template
      # should model the deciding (#1473).
      data_policy:
        classification: internal
      prompt: |
        Write a concise project health summary using ONLY the data below.

        RECENT COMMITS (last 24h):
        {{commits}}

        OPEN ISSUES (assigned to me):
        {{issues}}

        OPEN PULL REQUESTS:
        {{prs}}

        Sections:
        1. **Activity** — what shipped or changed in the last 24 hours
        2. **Issues** — issues needing attention today; omit if empty
        3. **PRs** — PRs waiting on review or action; omit if empty
        4. **Health** — one-sentence overall assessment (on track / needs attention / blocked)
      # Use the claude-code driver (subprocess `claude -p`) — runs under
      # your existing Claude Code subscription. Switch to `driver: claude`
      # only if you have ANTHROPIC_API_KEY set and prefer the API path.
      driver: claude-code
    awaits: [gather]
  - id: write
    tool: file.write
    path: ~/.patchwork/inbox/health-{{date}}.md
    content: |
      # Project health — {{date}}

      {{summarize}}
    awaits: [summarize]
