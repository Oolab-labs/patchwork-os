name: morning-brief-slack
description: Daily morning brief combining calendar, GitHub PRs, and Linear issues — posted to Slack.
# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.write
  - slack.post_message

# Run-level completion contract. Every step can report ok and the run can still
# finish `done` having produced no `brief` — an agent that narrates instead of
# answering, or a driver that returns empty, leaves the key unset and the step
# after it writes a heading with nothing under it. That is this recipe's real
# failure mode and it is silent.
#
# Checked AFTER the last step; it does NOT change the run's status. A violation
# is recorded as `assertionFailures` on the run and counted by `patchwork halts`
# under `completion contract failed`. So the run still writes whatever it
# produced — this reports, it does not roll back.
#
# Asserts only the brief it posts to Slack: the upstream fetch steps are
# allowed to come back empty (no commits today, an empty calendar), and turning
# a quiet day into a halt would be a contract that cries wolf.
expect:
  outputs:
    - brief

trigger:
  type: cron
  at: "0 8 * * 1-5"
steps:
  - tool: github.list_prs
    author: "@me"
    max: 10
    into: prs
  - tool: linear.list_issues
    assignee: "@me"
    state: "started,unstarted"
    max: 15
    into: linear_issues
  - tool: calendar.list_events
    days_ahead: 1
    max: 10
    into: calendar
  - agent:
      # Declared `personal` because this step HANDLES personal data — mail,
      # calendar entries, a private task list — even where the prompt text only
      # says how to go and fetch it (#1473). Classify by what the step handles,
      # including whatever its tools return.
      #
      # CONSEQUENCE, stated so it is not a surprise: if you have registered a
      # remote destination that does not accept `personal`, this step resolves to
      # LOCAL_ONLY and REFUSES rather than silently downgrading. That is the
      # boundary working. Resolve it by pointing this step at a local driver, or
      # by widening the destination's classifications if that is what you intend.
      # With no `privacy` block configured the boundary is inert and nothing changes.
      data_policy:
        classification: personal
      prompt: |
        You are a personal assistant writing a concise morning brief. Use ONLY the data provided below — do not call any tools or fetch additional information.

        OPEN PULL REQUESTS (authored by me):
        {{prs}}

        LINEAR ISSUES (assigned to me, in progress or unstarted):
        {{linear_issues}}

        TODAY'S CALENDAR EVENTS:
        {{calendar}}

        Write a short morning brief for Slack. Rules:
        - Plain text only. No markdown headers (no # or ## lines). No code blocks.
        - Use emoji to start each section.
        - Do NOT include a title or greeting line like "Morning Brief" or "Good morning" — start directly with the first section.

        📅 *Calendar* — list today's meetings with time; write "No meetings today" if empty or error
        🔀 *Pull Requests* — list open PRs needing attention; omit section entirely if empty
        📋 *Linear* — list in-progress and unstarted issues by priority; omit section entirely if empty or error

        Keep it under 15 lines. Be direct. Output only the brief, nothing else.
      driver: claude-code
      model: claude-haiku-4-5-20251001
      into: brief
  - tool: file.write
    path: ~/.patchwork/inbox/morning-brief-{{date}}.md
    content: |
      # Morning brief — {{date}}

      {{brief}}
  - tool: slack.post_message
    channel: your-channel-name
    text: |
      *Morning Brief — {{date}}*

      {{brief}}
