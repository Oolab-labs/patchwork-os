name: morning-brief-webhook
description: |
  On-demand morning brief — fires the moment you POST. Pair this with an
  iOS Shortcut on your home screen ("Brief me") so you get the digest
  whenever you're ready, not on a fixed cron schedule.

  For the scheduled (cron) version, see ../morning-brief.yaml.

  Suggested triggers:
    - iOS Shortcut on first phone unlock
    - Apple Watch complication tap
    - Home Assistant motion sensor at the kitchen counter
    - Stream Deck "morning routine" macro

  Example request:
    curl -X POST http://localhost:3101/hooks/morning-brief

# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.write

trigger:
  type: webhook
  path: /morning-brief

steps:
  - tool: gmail.fetch_unread
    since: 24h
    max: 30
    into: messages
  - tool: github.list_issues
    assignee: "@me"
    max: 10
    into: issues
  - tool: linear.list_issues
    assignee: "@me"
    state: "started,unstarted"
    max: 15
    into: linear_issues
  - tool: calendar.list_events
    days_ahead: 1
    max: 10
    into: calendar
  - agent:
      # Declared `personal` because this step HANDLES personal data, even where the
      # prompt text only says how to go and fetch it (#1473). Classify by what the
      # step handles, including whatever its tools return.
      #
      # CONSEQUENCE, stated so it is not a surprise: if you have registered a
      # remote destination that does not accept `personal`, this step resolves to
      # LOCAL_ONLY and REFUSES rather than silently downgrading. That is the
      # boundary working. Point the step at a local driver, or widen the
      # destination if that is what you intend. With no `privacy` block configured
      # the boundary is inert and nothing changes.
      data_policy:
        classification: personal
      prompt: |
        Write a 12-line morning brief from this data, in plain English,
        prioritising what needs attention today.

        Email (unread, 24h):  {{messages}}
        GitHub issues (mine): {{issues}}
        Linear (mine):        {{linear_issues}}
        Calendar (next 24h):  {{calendar}}
      into: brief
  - tool: file.write
    path: ~/.patchwork/inbox/morning-brief-{{date}}.md
    content: |
      # Morning brief — {{date}}
      {{brief}}

output:
  path: ~/.patchwork/inbox/morning-brief-{{date}}.md
