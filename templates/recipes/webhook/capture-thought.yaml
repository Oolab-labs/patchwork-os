name: capture-thought
description: |
  Append a thought to your daily journal from anywhere that can POST HTTP.

  Suggested triggers:
    - iOS Shortcut (Hey Siri, "capture thought") — see docs/triggers
    - Stream Deck button
    - NFC tag near your desk
    - curl from another script

  Example request:
    curl -X POST http://localhost:3101/hooks/capture-thought \
      -H 'Content-Type: application/json' \
      -d '{"text":"the auth refresh path needs a circuit breaker"}'

# Writes this recipe performs, acknowledged up front. Enforced only when
# PATCHWORK_FLAG_ENFORCE_ALLOWWRITES is set, which is off by default — but a
# template that omits it breaks at its write step the moment an operator turns
# that hardening flag on, which is a reasonable thing for them to do.
allowWrites:
  - file.append

trigger:
  type: webhook
  path: /capture-thought

steps:
  - tool: file.append
    path: ~/.patchwork/journal/{{date}}.md
    content: "- {{time}}  {{payload.text}}\n"

output:
  path: ~/.patchwork/journal/{{date}}.md
