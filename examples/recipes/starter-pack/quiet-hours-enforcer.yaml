# vision-tier — this recipe references integrations that are not yet
# bundled with patchwork-os. Steps that depend on a missing tool will
# `skip` (with a warning) rather than crash; see ./README.md for status.
# requires: notify-mcp, queue-mcp
version: 1.0.0
name: quiet-hours-enforcer
description: >
  Between 21:00 and 07:00, intercepts non-urgent notifications, batches them into one digest
  delivered with morning-brief. Whitelist for real emergencies (family, on-call). Learns from what
  you actually respond to.
trigger:
  type: event
  on: notification.incoming
  filter:
    time_range: 21:00-07:00
context:
  - type: env
    keys:
      - USER_NAME
  - type: file
    path: ~/.patchwork/quiet-hours-whitelist.md
steps:
  - id: classify
    risk: high
    agent:
      prompt: |
        Is this notification urgent enough to break quiet hours for {{USER_NAME}}?
        Whitelist: ~/.patchwork/quiet-hours-whitelist.md
        Urgent = on-call alert, family emergency keyword, known-VIP sender with
        "urgent"/"asap"/"emergency" in subject.
        Return JSON: { urgent: bool, batch: bool, reason: string }
        `batch` is the inverse of `urgent` — set exactly one of them true.
        Input: {{event.notification}}
      into: verdict
  # Was a `branch:` step. `branch:` is not implemented in ANY runner, so the
  # whole deliver-or-batch decision silently did nothing: the step was recorded
  # as skipped and the run reported success. Rewritten as two `when:`-guarded
  # steps, which the flat runner does execute. The guards need both booleans
  # because `when:` is a truthiness check with no negation operator — hence
  # `batch` above rather than an `otherwise:` arm.
  - id: deliver_urgent
    when: "{{verdict.urgent}}"
    tool: notify.push
    risk: high
    title: "{{event.notification.title}}"
    body: "{{event.notification.body}}"
    sound: true
  - id: batch_the_rest
    when: "{{verdict.batch}}"
    tool: queue.append
    risk: low
    queue: morning-digest
    item: "{{event.notification}}"
on_error:
  notify: false
  retry: 0
  fallback: deliver_original
