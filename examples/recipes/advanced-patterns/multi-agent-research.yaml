# Fan-out research: a planner splits a question into threads, `fan_out` runs
# one agent call per thread, and a final agent synthesises the results.
#
# Why `fan_out` with `do.agent` and not `parallel: {each}`: no runner
# implements the map-reduce form. `fan_out` runs one agent call per item and
# the runner admits each call against the run budget, so a long thread list
# stops at the cap instead of discovering it afterwards.
#
# Honest limits:
#   - Iterations run serially, not in parallel.
#   - Each thread's agent sees only its own prompt. The synthesis step is the
#     only place the threads meet.
#   - A failed thread is recorded in the aggregate with ok:false
#     (on_iter_error: continue); the synthesis step is told to say so rather
#     than paper over it.
apiVersion: patchwork.sh/v1
version: 2.0.0
name: multi-agent-research
description: >
  Research a question by planning 3-5 independent threads, running one agent
  call per thread with fan_out, then synthesising the results into a single
  document.
trigger:
  type: manual
  inputs:
    - name: question
      type: text
      required: true
      description: The research question to investigate
    - name: subtopics
      type: text
      description: Optional angles to cover, comma-separated. Leave empty to let the planner decide.
    - name: output_path
      type: string
      default: ~/.patchwork/inbox/research-{{date}}.md
allowWrites:
  - file.write
steps:
  - id: plan
    risk: low
    agent:
      prompt: |
        Question: {{question}}
        Caller-provided subtopics: {{subtopics}}

        If no subtopics were provided, decompose the question into 3-5 research
        threads. Each thread must be independently answerable: no thread may
        depend on another's answer.

        Return ONLY a JSON array of research prompts, one string per thread,
        for example:
        ["Research prompt for thread 1...", "Research prompt for thread 2..."]
      into: threads

  - id: research
    tool: fan_out
    risk: low
    items: "{{threads}}"
    as: thread
    max_iterations: 8
    on_iter_error: continue
    into: findings
    do:
      agent:
        prompt: |
          {{thread}}

          Answer this one thread only. Be concrete, cite what you rely on, and
          say plainly where you are unsure. 400 words max.

  - id: synthesize
    risk: low
    agent:
      prompt: |
        You are synthesising separate research threads into one document.

        Question: {{question}}

        Thread results (a JSON array; each entry has "ok" and "output", and a
        failed thread has ok:false):
        {{findings}}

        Write a structured research document:
        - Start with a 3-sentence executive summary
        - One section per thread (drop redundancy across threads)
        - If any thread failed, say which and that its angle is not covered
        - End with "Tensions & open questions" for anything the threads disagree on
        - 1000 words max unless the complexity genuinely demands more
      into: synthesis

  - id: write
    tool: file.write
    risk: low
    path: "{{output_path}}"
    content: "{{synthesis}}"

on_error:
  notify: true
  retry: 0
