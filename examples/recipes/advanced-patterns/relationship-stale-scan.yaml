#   - filter pipes (`{{x | filter(...)}}`) and function calls
#     (`{{file_read(...)}}`): the template renderer is flat-key + dot-path only;
#   - a step-level `each:` on `gmail.send`, which no runner implements;
#   - `file.list`, `dashboard.render` (with per-item approvals) and
#     `gmail.send`, which are not registered recipe tools. An unregistered tool
#     is SKIPPED, so the run would finish without sending anything.
